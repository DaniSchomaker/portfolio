<section>
  <div class="content-container p-lr">
    <div class="layout">
      <div class="info-column">
        <span class="subtitle">{{ 'skills.subtitle' | translate }}</span>
        <div class="info-card">
          <h2>{{ 'skills.title' | translate }}</h2>
          <p class="info-card-general">
            {{ 'skills.stack' | translate }}
          </p>

          <div class="span-wrapper">
            <span class="span">{{ 'skills.span-01' | translate }} </span>
            <span class="span span-highlight">{{ 'skills.span-02' | translate }}</span>
          </div>

          <p class="info-card-endnote">
            {{ 'skills.contact' | translate }}
          </p>
          <div class="skills-button">
            <a href="#contact">
              <button class="button-animated">
                <span class="button-text">Let's Talk</span>
              </button>
            </a>
          </div>
        </div>
      </div>

      <div class="icons-column">
        <div class="skills-wrapper">
          @for (item of skills; track item) {
            <div class="skill-item">
              <img src="{{ item.src }}" alt="{{ item.name }} Icon" />
              <p>{{ item.name }}</p>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
