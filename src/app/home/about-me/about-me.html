<section>
  <div class="content-container p-lr">
    <div class="layout">
      <div class="image-column">
        <div class="photo-wrapper">
          <img class="photo-bg" src="img/about-me/profilfoto-bg.png" alt="" />

          <div class="photo-clip">
            <img class="photo" src="img/about-me/profilfoto.jpg" alt="Profilfoto" />
          </div>
        </div>
      </div>

      <div class="info-column">
        <span class="subtitle">{{ 'aboutMe.subtitle' | translate }}</span>

        <div class="info-card">
          <h2>{{ 'aboutMe.title' | translate }}</h2>
          <p class="info-card-general">
            {{ 'aboutMe.intro' | translate }}
          </p>

          <ul class="info-list">
            <li class="info-item">
              <img class="info-icon" src="img/icons/about-me-location.svg" alt="" />
              <p class="info-text">
                {{ 'aboutMe.residence' | translate }}
              </p>
            </li>

            <li class="info-item">
              <img class="info-icon" src="img/icons/about-me-brain.svg" alt="" />
              <p class="info-text">
                {{ 'aboutMe.openness' | translate }}
              </p>
            </li>

            <li class="info-item">
              <img class="info-icon" src="img/icons/about-me-gear.svg" alt="" />
              <p class="info-text">
                {{ 'aboutMe.improve' | translate }}
              </p>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
